name: Build AttackVPN APK

on:
  push:
    branches: [main, master]
    tags: ['V*', 'v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null || true

      - name: Generate Android project
        run: |
          set -e
          test -f index.html || { echo "index.html not found in repo root"; exit 1; }
          A=android/app/src/main
          mkdir -p $A/java/com/attackvpn/app $A/assets $A/res/drawable

          cp index.html $A/assets/index.html
          if [ -f logo.jpg ]; then
            cp logo.jpg $A/assets/logo.jpg
            convert logo.jpg -resize 512x512^ -gravity center -extent 512x512 $A/res/drawable/ic_launcher.jpg || cp logo.jpg $A/res/drawable/ic_launcher.jpg
          else
            echo "logo.jpg not found - using placeholder icon"
            convert -size 512x512 xc:'#05080d' $A/res/drawable/ic_launcher.png
          fi

          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = 'AttackVPN'
          include ':app'
          EOF

          cat > android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.attackvpn.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.attackvpn.app'
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF

          cat > $A/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:label="AttackVPN"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > $A/java/com/attackvpn/app/MainActivity.java <<'EOF'
          package com.attackvpn.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.VpnService;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView w;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(Color.parseColor("#05080d"));
                  getWindow().setNavigationBarColor(Color.parseColor("#05080d"));
                  w = new WebView(this);
                  w.setBackgroundColor(Color.parseColor("#05080d"));
                  setContentView(w);
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  w.setWebViewClient(new WebViewClient());
                  w.addJavascriptInterface(new Bridge(), "AndroidBridge");
                  w.loadUrl("file:///android_asset/index.html");
              }

              class Bridge {
                  @JavascriptInterface
                  public void requestPermissions() {
                      runOnUiThread(() -> askPerms());
                  }
              }

              private void askPerms() {
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                  } else {
                      askVpn();
                  }
              }

              @Override
              public void onRequestPermissionsResult(int rc, String[] p, int[] g) {
                  super.onRequestPermissionsResult(rc, p, g);
                  askVpn();
              }

              private void askVpn() {
                  Intent i = VpnService.prepare(this);
                  if (i != null) startActivityForResult(i, 2);
              }

              @Override
              public void onBackPressed() {
                  if (w.canGoBack()) w.goBack(); else super.onBackPressed();
              }
          }
          EOF

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Name APK
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then N="AttackVPN${GITHUB_REF_NAME}"; else N="AttackVPN-dev"; fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "$N.apk"
          echo "APK_FILE=$N.apk" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: AttackVPN-apk
          path: ${{ env.APK_FILE }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: AttackVPN ${{ github.ref_name }}
          files: ${{ env.APK_FILE }}
