name: AttackVPN Auto Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "AttackVPN Release v1.0.${{ github.run_number }}"
          body: "Avtomatik yaradılmış AttackVPN dashboard relizi. İçində 35 dil və Anti-Detection modulları mövcuddur."
          files: |
            index.html
            logo.jpg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
