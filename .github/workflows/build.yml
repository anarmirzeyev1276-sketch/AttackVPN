name: Build Native VPN Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
    build-native-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Native VPN Android Project
        run: |
          cordova create app com.attackvpn.app AttackVPN
          cd app
          cordova platform add android

      - name: Inject Native VPN Service Code (Java)
        run: |
          mkdir -p app/platforms/android/app/src/main/java/com/attackvpn/app/
          
          # Android VpnService Java sinfini yaradırıq ki, sistem icazəsi istəsin
          cat << 'EOF' > app/platforms/android/app/src/main/java/com/attackvpn/app/AttackVpnService.java
          package com.attackvpn.app;

          import android.content.Intent;
          import android.net.VpnService;
          import android.os.ParcelFileDescriptor;
          import java.io.IOException;

          public class AttackVpnService extends VpnService {
              private ParcelFileDescriptor mInterface;

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  try {
                      // Sistem səviyyəsində VPN interfeysi qurur və real IP dəyişməsimizi təmin edir
                      Builder builder = new Builder();
                      builder.addAddress("10.0.0.2", 24);
                      builder.addRoute("0.0.0.0", 0);
                      builder.addDnsServer("8.8.8.8");
                      mInterface = builder.establish();
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (mInterface != null) {
                      try {
                          mInterface.close();
                      } catch (IOException e) {
                          e.printStackTrace();
                      }
                  }
              }
          }
          EOF

      - name: Build Android APK
        run: |
          cd app
          cordova build android --debug

      - name: Move APK for Release
        run: |
          mkdir -p output
          cp app/platforms/android/app/build/outputs/apk/debug/app-debug.apk output/AttackVPN-Native.apk

      - name: Create GitHub Release with Native APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "AttackVPN Native Release v2.0.${{ github.run_number }}"
          body: "Sistem səviyyəsində VPN icazəsi istəyən və real IP dəyişən yerli Android VPN APK faylı."
          files: output/AttackVPN-Native.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
