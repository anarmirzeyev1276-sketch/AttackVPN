name: Build AttackVPN APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VER: V${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null || true

      - name: Generate Android project
        env:
          WG_CONF: ${{ secrets.WG_CONF }}
        run: |
          set -e
          test -f index.html || { echo "index.html not found in repo root"; exit 1; }
          A=android/app/src/main
          mkdir -p $A/java/com/attackvpn/app $A/assets $A/res/drawable

          cp index.html $A/assets/index.html
          if [ -f wg.conf ]; then cp wg.conf $A/assets/wg.conf; fi
          if [ -n "$WG_CONF" ]; then printf '%s' "$WG_CONF" > $A/assets/wg.conf; fi
          if [ -f logo.jpg ]; then
            cp logo.jpg $A/assets/logo.jpg
            convert logo.jpg -resize 512x512^ -gravity center -extent 512x512 $A/res/drawable/ic_launcher.jpg || cp logo.jpg $A/res/drawable/ic_launcher.jpg
          else
            echo "logo.jpg not found - using placeholder icon"
            convert -size 512x512 xc:'#05080d' $A/res/drawable/ic_launcher.png
          fi

          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = 'AttackVPN'
          include ':app'
          EOF

          cat > android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.attackvpn.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.attackvpn.app'
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
              coreLibraryDesugaringEnabled true
            }
          }
          dependencies {
            implementation 'com.wireguard.android:tunnel:1.0.20230706'
            coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
          }
          EOF

          cat > $A/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:label="AttackVPN"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > $A/java/com/attackvpn/app/MainActivity.java <<'EOF'
          package com.attackvpn.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.VpnService;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.wireguard.android.backend.GoBackend;
          import com.wireguard.android.backend.Tunnel;
          import com.wireguard.config.Config;
          import java.io.BufferedReader;
          import java.io.StringReader;
          import com.wireguard.crypto.KeyPair;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
              private WebView w;
              private GoBackend backend;
              private String pending;

              private final Tunnel tunnel = new Tunnel() {
                  @Override public String getName() { return "attackvpn"; }
                  @Override public void onStateChange(Tunnel.State s) { }
              };

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(Color.parseColor("#05080d"));
                  getWindow().setNavigationBarColor(Color.parseColor("#05080d"));
                  backend = new GoBackend(getApplicationContext());
                  w = new WebView(this);
                  w.setBackgroundColor(Color.parseColor("#05080d"));
                  setContentView(w);
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  w.setWebViewClient(new WebViewClient());
                  w.addJavascriptInterface(new Bridge(), "AndroidBridge");
                  w.loadUrl("file:///android_asset/index.html");
              }

              class Bridge {
                  @JavascriptInterface
                  public void requestPermissions() {
                      runOnUiThread(() -> askPerms());
                  }

                  @JavascriptInterface
                  public void startVpn(String conf) {
                      runOnUiThread(() -> connect(conf));
                  }

                  @JavascriptInterface
                  public void stopVpn() {
                      new Thread(() -> {
                          try { backend.setState(tunnel, Tunnel.State.DOWN, null); } catch (Exception ignored) { }
                      }).start();
                  }
              }

              private void js(String code) {
                  runOnUiThread(() -> w.evaluateJavascript(code, null));
              }

              private void connect(String conf) {
                  pending = conf;
                  Intent i = VpnService.prepare(this);
                  if (i != null) startActivityForResult(i, 3); else bringUp();
              }

              private void bringUp() {
                  final String conf = pending;
                  new Thread(() -> {
                      try {
                          Config c = Config.parse(new BufferedReader(new StringReader(resolveConf(conf))));
                          backend.setState(tunnel, Tunnel.State.UP, c);
                          js("onVpn(true,'')");
                      } catch (Exception e) {
                          js("onVpn(false," + JSONObject.quote(String.valueOf(e.getMessage())) + ")");
                      }
                  }).start();
              }

              private String resolveConf(String conf) throws Exception {
                  if (conf != null && !conf.trim().isEmpty()) return conf;
                  android.content.SharedPreferences sp = getSharedPreferences("atk", MODE_PRIVATE);
                  String saved = sp.getString("warp", null);
                  if (saved != null) return saved;
                  try (java.io.InputStream in = getAssets().open("wg.conf")) {
                      java.io.ByteArrayOutputStream o = new java.io.ByteArrayOutputStream();
                      byte[] b = new byte[4096];
                      int n;
                      while ((n = in.read(b)) > 0) o.write(b, 0, n);
                      String s = o.toString("UTF-8");
                      if (!s.trim().isEmpty()) return s;
                  } catch (java.io.FileNotFoundException ignored) { }
                  String c = registerWarp();
                  sp.edit().putString("warp", c).apply();
                  return c;
              }

              private String registerWarp() throws Exception {
                  KeyPair kp = new KeyPair();
                  String pub = kp.getPublicKey().toBase64();
                  String priv = kp.getPrivateKey().toBase64();
                  java.text.SimpleDateFormat f = new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.000'Z'", java.util.Locale.US);
                  f.setTimeZone(java.util.TimeZone.getTimeZone("UTC"));
                  JSONObject req = new JSONObject();
                  req.put("key", pub);
                  req.put("install_id", "");
                  req.put("fcm_token", "");
                  req.put("tos", f.format(new java.util.Date()));
                  req.put("type", "Android");
                  req.put("model", "PC");
                  req.put("locale", "en_US");
                  java.net.HttpURLConnection h = (java.net.HttpURLConnection) new java.net.URL("https://api.cloudflareclient.com/v0a2158/reg").openConnection();
                  h.setRequestMethod("POST");
                  h.setDoOutput(true);
                  h.setConnectTimeout(15000);
                  h.setReadTimeout(15000);
                  h.setRequestProperty("Content-Type", "application/json");
                  h.setRequestProperty("User-Agent", "okhttp/3.12.1");
                  h.setRequestProperty("CF-Client-Version", "a-6.3-2158");
                  h.getOutputStream().write(req.toString().getBytes("UTF-8"));
                  if (h.getResponseCode() != 200) throw new Exception("Server registration failed: HTTP " + h.getResponseCode());
                  java.io.ByteArrayOutputStream o = new java.io.ByteArrayOutputStream();
                  java.io.InputStream in = h.getInputStream();
                  byte[] b = new byte[4096];
                  int n;
                  while ((n = in.read(b)) > 0) o.write(b, 0, n);
                  JSONObject cfg = new JSONObject(o.toString("UTF-8")).getJSONObject("config");
                  JSONObject a = cfg.getJSONObject("interface").getJSONObject("addresses");
                  String peerPk = cfg.getJSONArray("peers").getJSONObject(0).getString("public_key");
                  return "[Interface]\nPrivateKey = " + priv + "\nAddress = " + a.getString("v4") + "/32, " + a.getString("v6") + "/128\nDNS = 1.1.1.1, 1.0.0.1\nMTU = 1280\n\n[Peer]\nPublicKey = " + peerPk + "\nAllowedIPs = 0.0.0.0/0, ::/0\nEndpoint = engage.cloudflareclient.com:2408\n";
              }

              private void askPerms() {
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                  } else {
                      askVpn();
                  }
              }

              @Override
              public void onRequestPermissionsResult(int rc, String[] p, int[] g) {
                  super.onRequestPermissionsResult(rc, p, g);
                  askVpn();
              }

              private void askVpn() {
                  Intent i = VpnService.prepare(this);
                  if (i != null) startActivityForResult(i, 2);
              }

              @Override
              protected void onActivityResult(int rq, int rs, Intent d) {
                  super.onActivityResult(rq, rs, d);
                  if (rq == 3) {
                      if (rs == RESULT_OK) bringUp(); else js("onVpn(false,'VPN permission denied')");
                  }
              }

              @Override
              public void onBackPressed() {
                  if (w.canGoBack()) w.goBack(); else super.onBackPressed();
              }
          }
          EOF

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Name APK
        run: |
          N="AttackVPN${VER}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$N.apk"
          echo "APK_FILE=$N.apk" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: AttackVPN-apk
          path: ${{ env.APK_FILE }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VER }}
          target_commitish: ${{ github.sha }}
          name: AttackVPN ${{ env.VER }}
          files: ${{ env.APK_FILE }}
          
